name: Build Documentary Video

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy imageio-ffmpeg

      - name: Build Video Step-by-Step
        shell: cmd
        run: |
          REM Jodi file-gulo india-population-doc folder-er bhetore thake, tahole sekhane dhukbe
          if exist india-population-doc cd india-population-doc

          python make_script.py SCRIPT.md
          python build_audio.py voices.json work
          powershell -NoProfile -ExecutionPolicy Bypass -File synth.ps1 -InFile work/tts_request.json -OutDir work/wav

          REM Auto-fix for KeyError: 'sentences' in timeline.py / content.py
          python -c "import pathlib; p=pathlib.Path('timeline.py'); t=p.read_text(encoding='utf-8'); p.write_text(t.replace('sc[\"sentences\"]', 'sc.get(\"sentences\", sc.get(\"lines\", sc.get(\"items\", [sc.get(\"text\", \"\")])))'), encoding='utf-8')"

          python timeline.py work work/timeline.json work/narration.wav
          python music.py work/narration.wav work/music.wav
          python render.py work/timeline.json work/frames
          python assemble.py work work/timeline.json work/narration.wav Population-Rising-India.mp4

      - name: Upload Finished Video
        uses: actions/upload-artifact@v4
        with:
          name: Final-Documentary-Video
          path: |
            **/Population-Rising-India.mp4
            **/work/subtitles.srt
