name: Build Documentary Video

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip fonts-dejavu-core
          pip install pillow numpy imageio-ffmpeg edge-tts

      - name: Extract and Prepare Audio
        run: |
          unzip -o india-population-doc.zip
          cd india-population-doc
          python make_script.py SCRIPT.md
          python build_audio.py voices.json work

      - name: Generate Voice Narration
        working-directory: india-population-doc
        shell: python
        run: |
          import json, os, subprocess, shutil
          os.makedirs("work/wav", exist_ok=True)
          req = json.load(open("work/tts_request.json"))
          manifest = []
          voice = "en-US-ChristopherNeural"
          for s in req["sentences"]:
              sid = str(s["id"])
              txt = str(s["text"])
              mp3 = f"work/wav/{sid}.mp3"
              wav = f"work/wav/{sid}.wav"
              cmd1 = ["edge-tts", "--voice", voice, "--text", txt, "--write-media", mp3]
              subprocess.run(cmd1, check=True)
              cmd2 = ["ffmpeg", "-y", "-i", mp3, "-ac", "1", "-ar", "22050", wav]
              subprocess.run(cmd2, check=True)
              os.remove(mp3)
              manifest.append({"id": sid, "file": wav})
              print("Done:", sid, flush=True)
          json.dump(manifest, open("work/wav/manifest.json", "w"))
          for f in os.listdir("work/wav"):
              if f.startswith("s99_"):
                  dst = "work/wav/" + f.replace("s99_", "s11_")
                  shutil.copyfile("work/wav/" + f, dst)

      - name: Fix Timeline and Render Video
        working-directory: india-population-doc
        shell: python
        run: |
          import subprocess, sys
          tcode = open("timeline.py").read()
          old_t = 'sc["sentences"]'
          new_t = 'sc.get("sentences", sc.get("lines", sc.get("text", [])))'
          open("timeline.py", "w").write(tcode.replace(old_t, new_t))
          rcode = open("render.py").read()
          bad_r = "base.split()[i].point(lambda v, cb=ov.split()[i]: min(255, v + cb))"
          fix_r = "__import__('PIL.ImageChops').ImageChops.add(base, ov).split()[i]"
          open("render.py", "w").write(rcode.replace(bad_r, fix_r))
          py = sys.executable
          subprocess.run([py, "timeline.py", "work", "work/timeline.json", "work/narration.wav"], check=True)
          subprocess.run([py, "music.py", "work/narration.wav", "work/music.wav"], check=True)
          subprocess.run([py, "render.py", "work/timeline.json", "work/frames"], check=True)
          subprocess.run([py, "assemble.py", "work", "work/timeline.json", "work/narration.wav", "Population-Rising-India.mp4"], check=True)

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: Final-Documentary-Video
          path: |
            india-population-doc/Population-Rising-India.mp4
            india-population-doc/Population-Rising-India.avi
            india-population-doc/work/subtitles.srt
