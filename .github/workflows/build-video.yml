name: Build Documentary Video

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip fonts-dejavu-core
          pip install pillow numpy imageio-ffmpeg edge-tts

      - name: Extract and Prepare Audio
        run: |
          unzip -o india-population-doc.zip
          cd india-population-doc
          python make_script.py SCRIPT.md
          python build_audio.py voices.json work

      - name: Generate Voice Narration
        working-directory: india-population-doc
        shell: python
        run: |
          import json, os, subprocess, shutil
          os.makedirs("work/wav", exist_ok=True)
          with open("work/tts_request.json", encoding="utf-8") as f:
              req = json.load(f)
          manifest = []
          for s in req["sentences"]:
              sid = str(s["id"])
              text = str(s["text"])
              mp3 = f"work/wav/{sid}.mp3"
              wav = f"work/wav/{sid}.wav"
              subprocess.run(["edge-tts", "--voice", "en-US-ChristopherNeural", "--text", text, "--write-media", mp3], check=True)
              subprocess.run(["ffmpeg", "-y", "-i", mp3, "-acodec", "pcm_s16le", "-ac", "1", "-ar", "22050", wav], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True)
              os.remove(mp3)
              manifest.append({"id": sid, "file": wav})
              print("Synthesized:", sid, flush=True)
