name: Build Documentary Video

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Python Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip fonts-dejavu-core
          pip install --upgrade pip
          pip install pillow numpy imageio-ffmpeg edge-tts

      - name: Auto-Find Files, Fix Code & Render Video
        run: |
          python3 - << 'EOF'
          import os, glob, zipfile, subprocess, sys, json, asyncio, shutil

          # 1. Extract zip if present
          for z in glob.glob("**/*.zip", recursive=True):
              print(f"Extracting {z}...")
              with zipfile.ZipFile(z, 'r') as zf:
                  zf.extractall(".")

          # 2. Enter project folder
          matches = glob.glob("**/make_script.py", recursive=True)
          proj_dir = os.path.dirname(os.path.abspath(matches[0]))
          os.chdir(proj_dir)
          print("Working inside directory:", proj_dir)

          # 3. Generate script and TTS request
          subprocess.run([sys.executable, "make_script.py", "SCRIPT.md"], check=True)
          subprocess.run([sys.executable, "build_audio.py", "voices.json", "work"], check=True)

          # 4. Synthesize Audio via Edge-TTS
          import edge_tts
          os.makedirs("work/wav", exist_ok=True)
          with open("work/tts_request.json", encoding="utf-8") as f:
              req = json.load(f)

          async def make_audio():
              manifest = []
              for s in req["sentences"]:
                  sid = str(s["id"])
                  text = str(s["text"])
                  mp3 = f"work/wav/{sid}.mp3"
                  wav = f"work/wav/{sid}.wav"
                  comm = edge_tts.Communicate(text, "en-US-ChristopherNeural")
                  await comm.save(mp3)
                  subprocess.run([
                      "ffmpeg", "-y", "-i", mp3,
                      "-acodec", "pcm_s16le", "-ac", "1", "-ar", "22050", wav
                  ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True)
                  os.remove(mp3)
                  manifest.append({"id": s["id"], "file": wav})
                  print(f"Synthesized: {sid}", flush=True)
              with open("work/wav/manifest.json", "w", encoding="utf-8") as mf:
                  json.dump(manifest, mf, indent=2)

          asyncio.run(make_audio())

          # 5. FIX: Scene ID vs Index mismatch (e.g. s99_00.wav -> s11_00.wav)
          import content
          for idx, sc in enumerate(content.SCENES):
              sc_id = sc.get("id", f"s{idx:02d}")
              idx_prefix = f"s{idx:02d}"
              if sc_id != idx_prefix:
                  for wav_file in glob.glob(f"work/wav/{sc_id}_*.wav"):
                      new_name = wav_file.replace(f"{sc_id}_", f"{idx_prefix}_")
                      shutil.copyfile(wav_file, new_name)
                      print(f"Mapped {wav_file} -> {new_name}")

          # 6. Run Timeline, Music, Render, Assemble
          subprocess.run([sys.executable, "timeline.py", "work", "work/timeline.json", "work/narration.wav"], check=True)
          subprocess.run([sys.executable, "music.py", "work/narration.wav", "work/music.wav"], check=True)
          subprocess.run([sys.executable, "render.py", "work/timeline.json", "work/frames"], check=True)
          subprocess.run([sys.executable, "assemble.py", "work", "work/timeline.json", "work/narration.wav", "Population-Rising-India.mp4"], check=True)
          EOF

      - name: Upload Finished Video
        uses: actions/upload-artifact
