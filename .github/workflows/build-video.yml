
name: Build India Population Video

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "./india-population-doc.zip" -DestinationPath "./project" -Force

      - name: Locate build script
        id: locate
        shell: pwsh
        run: |
          $script = Get-ChildItem "./project" -Filter "build.ps1" -Recurse | Select-Object -First 1
          if (-not $script) { throw "build.ps1 not found in ZIP" }
          "SCRIPT_DIR=$($script.DirectoryName)" >> $env:GITHUB_ENV


      - name: Fix timeline outro
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $timeline = Get-ChildItem "./project" -Filter "timeline.py" -Recurse | Select-Object -First 1
          if (-not $timeline) { throw "timeline.py not found" }
          $source = [System.IO.File]::ReadAllText($timeline.FullName)
          $old = 'all_scenes = list(SCENES) + [dict(id="outro", title="", kicker="", source=CREDITS)]'
          $new = 'all_scenes = list(SCENES) + [dict(id="outro", title="", kicker="", source=CREDITS, sentences=[OUTRO_LINE])]'
          if (-not $source.Contains($old)) { throw "Expected timeline line not found" }
          $source = $source.Replace($old, $new)
          [System.IO.File]::WriteAllText($timeline.FullName, $source, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Timeline outro patched."
          
      - name: Debug narration audio files
        shell: pwsh
        run: |
          Write-Host "Searching project for WAV files..."
          Get-ChildItem "./project" -Filter "*.wav" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
          Write-Host "Searching for narration files..."
          Get-ChildItem "./project" -Filter "*narration*" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
            
          
      - name: Build MP4 video
        shell: pwsh
        run: |
          Set-Location $env:SCRIPT_DIR
          & ".\build.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Video build failed" }

      - name: Upload video files
        uses: actions/upload-artifact@v4
        with:
          name: India-Population-Video
          path: |
            project/**/*.mp4
          if-no-files-found: error
          retention-days: 7
